# Azure profile — all values injected via Azure App Settings (environment variables)
# Activate with: SPRING_PROFILES_ACTIVE=azure

spring:
  datasource:
    url: ${AZURE_POSTGRESQL_URL}
    username: ${AZURE_POSTGRESQL_USERNAME}
    password: ${AZURE_POSTGRESQL_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5          # Keep low for small Azure tiers

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false                 # Disable in production
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${AZURE_REDIS_HOST}
      port: 6380                    # Azure Cache for Redis uses SSL port 6380
      password: ${AZURE_REDIS_PASSWORD}
      ssl:
        enabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: user:email, read:user

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      chat:
        options:
          model: gpt-4o
          temperature: 0.3

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

logging:
  level:
    com.codesync: INFO
    org.springframework.security: WARN
